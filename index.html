const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.salt),iterations:D.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},key,b64(D.ct));
  return new TextDecoder().decode(pt);
}
async function go(pw,remember){
  try{const html=await open_(pw);
    if(remember){try{sessionStorage.setItem("pw",pw);}catch(e){}}
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById("err").textContent="Wrong password.";}
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();go(document.getElementById("pw").value,true);});
try{const s=sessionStorage.getItem("pw");if(s)go(s,false);}catch(e){}
